# Hacktoberfest weekend demo (H6) — Render Blueprint.
# Branch: hacktoberfest/render-session-note
# Manual dashboard deploy is fine too; this documents the intended shape.
# Secrets (GROQ_API_KEY, CLERK_SECRET_KEY, …) stay in the Render dashboard — do not put them here.

databases:
  - name: casescriptai-hacktoberfest-db
    plan: free
    databaseName: casescriptai_demo
    user: casescriptai

services:
  - type: web
    name: casescriptai-hacktoberfest-api
    runtime: node
    plan: free
    branch: hacktoberfest/render-session-note
    # Monorepo root — Yarn 4 (packageManager in root package.json).
    buildCommand: corepack enable && yarn workspaces focus hacktoberfest-api
    preDeployCommand: yarn workspace hacktoberfest-api migrate
    startCommand: yarn workspace hacktoberfest-api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        fromDatabase:
          name: casescriptai-hacktoberfest-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        fromService:
          name: casescriptai-hacktoberfest-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LIVE_PROVIDER_SMOKE
        value: '0'
      # Set in dashboard (sync: false): GROQ_API_KEY, CLERK_SECRET_KEY,
      # IP_HASH_SALT, optional DEMO_ACCESS_KEY / GOOGLE_AI_API_KEY / LLM_TIMEOUT_MS
      - key: GROQ_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: DEMO_ACCESS_KEY
        sync: false
