<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-logo {
            animation: fadeIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .animate-text {
            opacity: 0;
            animation: slideUpFade 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
        }

        .animate-tagline {
            opacity: 0;
            animation: slideUpFade 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
        }

        /* Organic Background Pulse */
        .bg-pulse-subtle {
            background: radial-gradient(circle at 50% 50%, #fcf9f5 0%, #f7f5f0 100%);

            // Micro-interaction: Subtle mouse movement affects the blur background
            const main = document.querySelector('main');
            const blobs = document.querySelectorAll('.rounded-full');
            
            main.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                
                blobs.forEach((blob, index) => {
                    const factor = index === 0 ? 1 : -1;
                    blob.style.transform = `translate(${moveX * factor}px, ${moveY * factor}px)`;
                });
            });
        });
    </script>
</body></html>
