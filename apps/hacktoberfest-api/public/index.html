<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaseScriptAI — Session note demo</title>
    <style>
      :root {
        --bg: #fcf9f5;
        --ink: #1c1c19;
        --muted: #717973;
        --sage: #3a6750;
        --panel: #f0ede9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, #e8f0ea, var(--bg) 55%);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(520px, 100%);
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 8px;
        color: var(--sage);
      }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.45; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: var(--sage);
        color: white;
        font: inherit;
        font-weight: 600;
        padding: 12px 22px;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }
      button:disabled { opacity: 0.55; cursor: wait; }
      .status {
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: 16px;
        background: var(--panel);
        min-height: 3.2rem;
      }
      a.download {
        display: inline-block;
        margin-top: 12px;
        color: var(--sage);
        font-weight: 600;
      }
      a.download[hidden] { display: none !important; }
      .disclaimer { margin-top: 28px; font-size: 0.85rem; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CaseScriptAI</h1>
      <p>
        Generate a structured session note PDF from the synthetic sample
        recording. Demo data only — not real PHI.
      </p>
      <button id="generate" type="button" disabled>Use sample session</button>
      <div class="status" id="status" aria-live="polite">Waking server (~1 min)…</div>
      <a class="download" id="download" hidden href="#">Download PDF</a>
      <p class="disclaimer">
        Audio is a fictional scripted conversation for Hacktoberfest. Not for
        clinical use.
      </p>
    </main>
    <script>
      /* Mirrors apps/hacktoberfest-api/src/demo-ui/poll-schedule.ts + friendly-demo-errors.ts */
      const POLL_MAX_WAIT_MS = 180000;
      const WAKE_TIMEOUT_MS = 90000;
      const WAKE_RETRY_GAP_MS = 2000;
      const NETWORK_FAIL_LIMIT = 3;

      const generateBtn = document.getElementById("generate");
      const statusEl = document.getElementById("status");
      const downloadEl = document.getElementById("download");
      let pollTimer = null;
      let serverReady = false;
      let pollCancelled = false;
      let reduceMotion = false;
      try {
        reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      } catch (_) {}

      const setStatus = (text) => {
        statusEl.textContent = text;
      };

      const stopPoll = () => {
        pollCancelled = true;
        if (pollTimer) {
          clearTimeout(pollTimer);
          pollTimer = null;
        }
      };

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      const nextPollDelayMs = (completedPolls) => {
        if (completedPolls < 5) return 1000;
        if (completedPolls < 15) return 2000;
        return 5000;
      };

      const friendlyFailure = (code) => {
        const c = code || "failed";
        if (c === "rate_limited") return "Too many demos — wait and tap Retry.";
        if (c === "busy") {
          return "Server is busy generating another note. Tap Retry in a moment.";
        }
        if (c === "demo_unavailable" || c === "sessions_unavailable") {
          return "Demo isn't ready yet. Wait for the server, then tap Retry.";
        }
        if (c === "demo_key_required") {
          return "This demo is locked. Ask the host for access.";
        }
        if (c === "interrupted_restart") {
          return "Server restarted mid-run. Tap Retry to start again.";
        }
        if (c === "llm_unavailable" || c === "llm_http_503" || c === "llm_timeout") {
          return "AI is busy or slow right now. Tap Retry — high demand is usually temporary.";
        }
        if (c === "llm_rate_limited" || c === "llm_http_429") {
          return "AI rate limit hit. Wait a moment, then tap Retry.";
        }
        if (c === "stt_timeout") return "Transcription timed out. Tap Retry.";
        if (c === "network" || c === "wake_timeout") {
          return "Can't reach server. Check your connection or try again.";
        }
        if (c === "poll_timeout") {
          return "Timed out waiting for the note. Tap Retry.";
        }
        return "Failed (" + c + "). Tap Retry to try again.";
      };

      const markRetryable = () => {
        generateBtn.disabled = false;
        generateBtn.textContent = serverReady ? "Retry sample session" : "Retry wake";
      };

      const wakeServer = async () => {
        const started = Date.now();
        serverReady = false;
        generateBtn.disabled = true;
        setStatus("Waking server (~1 min)…");
        while (Date.now() - started < WAKE_TIMEOUT_MS) {
          try {
            const res = await fetch("/health");
            if (res.ok) {
              serverReady = true;
              generateBtn.disabled = false;
              generateBtn.textContent = "Use sample session";
              setStatus("Ready.");
              return;
            }
          } catch (_) {
            /* cold start / offline — keep trying until wake timeout */
          }
          await sleep(WAKE_RETRY_GAP_MS);
        }
        setStatus(friendlyFailure("wake_timeout"));
        markRetryable();
      };

      const stepLabel = (status) => {
        if (status === "queued") return "Queued…";
        if (status === "stt_running") return "Transcribing…";
        if (status === "llm_running") return "Writing note…";
        if (status === "pdf_running") return "Building PDF…";
        if (status === "ready") return "Ready.";
        return "Status: " + status;
      };

      const pollSession = (id) => {
        stopPoll();
        pollCancelled = false;
        const started = Date.now();
        let completedPolls = 0;
        let networkFails = 0;

        const scheduleNext = () => {
          if (pollCancelled) return;
          const delay = reduceMotion
            ? Math.max(nextPollDelayMs(completedPolls), 1000)
            : nextPollDelayMs(completedPolls);
          completedPolls += 1;
          pollTimer = setTimeout(() => {
            void tick();
          }, delay);
        };

        const tick = async () => {
          if (pollCancelled) return;
          if (document.hidden) {
            scheduleNext();
            return;
          }
          if (Date.now() - started >= POLL_MAX_WAIT_MS) {
            setStatus(friendlyFailure("poll_timeout"));
            markRetryable();
            return;
          }
          try {
            const res = await fetch("/sessions/" + id);
            const data = await res.json();
            networkFails = 0;
            if (!res.ok) {
              setStatus(friendlyFailure(data.error || "status_failed"));
              markRetryable();
              return;
            }
            if (data.status === "failed") {
              setStatus(friendlyFailure(data.error || "failed"));
              markRetryable();
              return;
            }
            setStatus(stepLabel(data.status));
            if (data.status === "ready" && data.pdfUrl) {
              downloadEl.hidden = false;
              downloadEl.href = data.pdfUrl;
              generateBtn.disabled = false;
              generateBtn.textContent = "Use sample session";
              return;
            }
            scheduleNext();
          } catch (_) {
            networkFails += 1;
            if (networkFails >= NETWORK_FAIL_LIMIT) {
              setStatus(friendlyFailure("network"));
              markRetryable();
              return;
            }
            setStatus("Connection issue — retrying…");
            scheduleNext();
          }
        };

        void tick();
      };

      document.addEventListener("visibilitychange", () => {
        /* tick() skips work while document.hidden; resume on next scheduled delay */
      });

      generateBtn.addEventListener("click", async () => {
        if (!serverReady) {
          await wakeServer();
          if (!serverReady) return;
        }
        generateBtn.disabled = true;
        downloadEl.hidden = true;
        setStatus("Starting…");
        try {
          const res = await fetch("/sessions/demo", { method: "POST" });
          let data = {};
          try {
            data = await res.json();
          } catch (_) {
            data = {};
          }
          if (!res.ok) {
            setStatus(friendlyFailure(data.error || "start_failed"));
            markRetryable();
            return;
          }
          setStatus(stepLabel(data.status));
          pollSession(data.id);
        } catch (_) {
          setStatus(friendlyFailure("network"));
          markRetryable();
        }
      });

      wakeServer();
    </script>
  </body>
</html>
