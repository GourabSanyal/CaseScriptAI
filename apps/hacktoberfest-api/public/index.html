<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaseScriptAI — Session note demo</title>
    <style>
      :root {
        --bg: #fcf9f5;
        --ink: #1c1c19;
        --muted: #717973;
        --sage: #3a6750;
        --panel: #f0ede9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, #e8f0ea, var(--bg) 55%);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(520px, 100%);
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 8px;
        color: var(--sage);
      }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.45; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: var(--sage);
        color: white;
        font: inherit;
        font-weight: 600;
        padding: 12px 22px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: wait; }
      .status {
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: 16px;
        background: var(--panel);
        min-height: 3.2rem;
      }
      a.download {
        display: inline-block;
        margin-top: 12px;
        color: var(--sage);
        font-weight: 600;
      }
      a.download[hidden] { display: none !important; }
      .disclaimer { margin-top: 28px; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>CaseScriptAI</h1>
      <p>
        Generate a structured session note PDF from the synthetic sample
        recording. Demo data only — not real PHI.
      </p>
      <button id="generate" type="button" disabled>Use sample session</button>
      <div class="status" id="status" aria-live="polite">Waking server (~1 min)…</div>
      <a class="download" id="download" hidden href="#">Download PDF</a>
      <p class="disclaimer">
        Audio is a fictional scripted conversation for Hacktoberfest. Not for
        clinical use.
      </p>
    </main>
    <script>
      const generateBtn = document.getElementById("generate");
      const statusEl = document.getElementById("status");
      const downloadEl = document.getElementById("download");
      let pollTimer = null;
      let serverReady = false;

      const setStatus = (text) => {
        statusEl.textContent = text;
      };

      const stopPoll = () => {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      };

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      const friendlyFailure = (code) => {
        if (
          code === "llm_unavailable" ||
          code === "llm_http_503" ||
          code === "llm_timeout"
        ) {
          return "AI is busy or slow right now. Tap Retry — high demand is usually temporary.";
        }
        if (code === "llm_rate_limited" || code === "llm_http_429") {
          return "AI rate limit hit. Wait a moment, then tap Retry.";
        }
        if (code === "stt_timeout") {
          return "Transcription timed out. Tap Retry.";
        }
        return "Failed (" + code + "). Tap Retry to try again.";
      };

      const markRetryable = () => {
        generateBtn.disabled = false;
        generateBtn.textContent = "Retry sample session";
      };

      const wakeServer = async () => {
        const started = Date.now();
        generateBtn.disabled = true;
        setStatus("Waking server (~1 min)…");
        while (Date.now() - started < 90000) {
          try {
            const res = await fetch("/health");
            if (res.ok) {
              serverReady = true;
              generateBtn.disabled = false;
              generateBtn.textContent = "Use sample session";
              setStatus("Ready.");
              return;
            }
          } catch (_) {}
          await sleep(2000);
        }
        setStatus("Server wake timed out. Refresh the page.");
      };

      const stepLabel = (status) => {
        if (status === "queued") return "Queued…";
        if (status === "stt_running") return "Transcribing…";
        if (status === "llm_running") return "Writing note…";
        if (status === "pdf_running") return "Building PDF…";
        if (status === "ready") return "Ready.";
        return "Status: " + status;
      };

      const pollSession = (id) => {
        stopPoll();
        pollTimer = setInterval(async () => {
          try {
            const res = await fetch("/sessions/" + id);
            const data = await res.json();
            if (!res.ok) {
              setStatus("Error: " + (data.error || "status_failed"));
              markRetryable();
              stopPoll();
              return;
            }
            if (data.status === "failed") {
              setStatus(friendlyFailure(data.error || "failed"));
              markRetryable();
              stopPoll();
              return;
            }
            setStatus(stepLabel(data.status));
            if (data.status === "ready" && data.pdfUrl) {
              downloadEl.hidden = false;
              downloadEl.href = data.pdfUrl;
              generateBtn.disabled = false;
              generateBtn.textContent = "Use sample session";
              stopPoll();
            }
          } catch {
            setStatus("Error: network — tap Retry.");
            markRetryable();
            stopPoll();
          }
        }, 1000);
      };

      generateBtn.addEventListener("click", async () => {
        if (!serverReady) {
          await wakeServer();
          if (!serverReady) return;
        }
        generateBtn.disabled = true;
        downloadEl.hidden = true;
        setStatus("Starting…");
        try {
          const res = await fetch("/sessions/demo", { method: "POST" });
          const data = await res.json();
          if (!res.ok) {
            setStatus(
              data.error === "rate_limited"
                ? "Too many demos — wait and tap Retry."
                : "Error: " + (data.error || "start_failed"),
            );
            markRetryable();
            return;
          }
          setStatus(stepLabel(data.status));
          pollSession(data.id);
        } catch {
          setStatus("Error: network — tap Retry.");
          markRetryable();
        }
      });

      wakeServer();
    </script>
  </body>
</html>
